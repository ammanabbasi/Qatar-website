name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.18+ is the floor: scripts/generate-og.mjs imports products.ts
          # directly via native TypeScript type stripping.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Three independent gates — run all three even if one fails so contributors
      # see every failure in a single run, not a drip of one-per-PR-push.
      - name: Typecheck
        if: always()
        run: npx tsc --noEmit

      - name: Lint
        if: always()
        run: npx eslint .

      - name: Build
        if: always()
        env:
          # Mirror production env surface so any metadataBase/sitemap logic that
          # reads NEXT_PUBLIC_SITE_URL resolves consistently in CI.
          NEXT_PUBLIC_SITE_URL: https://abktradingservice.com
        run: npx next build
